# Desktop packages (T4.1.3, ADR-0023): pushing a tag `desktop-v<version>` builds macOS
# (universal .dmg), Windows (.exe, NSIS) and Linux (AppImage) installers against the production
# API and attaches them to a GitHub release, with signed update artifacts and latest.json. The packages are unsigned (no Apple or Windows
# certificate); apps/desktop/README.md explains how testers open them.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXPO_PUBLIC_API_URL: https://api.routune.dev

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          node -e '
            const fs = require("fs");
            const path = "apps/desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          ' "$version"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libdbus-1-dev pkg-config

      # The toolchain comes from rust-toolchain.toml at the repository root.
      - name: Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts and latest.json for the in-app updater (T4.1.4).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Routune Desktop v__VERSION__
          releaseBody: |
            Routune masaüstü beta sürümü. Kurulum ve imzasız uygulama uyarıları için:
            https://github.com/${{ github.repository }}/blob/main/apps/desktop/README.md
          releaseDraft: false
          # Not a pre-release: the updater reads releases/latest/download/latest.json, so the
          # newest desktop release must be the repository's "latest" release (mobile releases
          # are published as pre-releases, T4.2.5).
          prerelease: false
