# CI (T0.1.4, ARCHITECTURE §17). Every job must pass before a PR is merged.
# Job names are stable: they are the checks to mark as "required" on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      # Installs the toolchain pinned in rust-toolchain.toml (incl. rustfmt + clippy).
      - name: Install Rust toolchain
        run: rustup toolchain install && rustc --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      # `cargo test` rewrites the ts-rs bindings; clearing first also catches removed types.
      - name: Clear generated API types
        run: rm -rf ../packages/api-types/src/generated

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # testcontainers-based integration tests use the runner's Docker daemon.
      - name: cargo test
        run: cargo test --workspace --locked

      # T0.2.7: packages/api-types must match the Rust DTOs (never edited by hand).
      - name: API types are up to date
        working-directory: .
        run: |
          node packages/api-types/scripts/build-index.mjs
          if [ -n "$(git status --porcelain -- packages/api-types)" ]; then
            git status --porcelain -- packages/api-types
            git --no-pager diff -- packages/api-types
            echo "::error::packages/api-types is out of date. Run 'pnpm api-types:generate' and commit the result."
            exit 1
          fi

  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  dev-env:
    name: Dev environment (compose + db-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Verify database
        run: sh scripts/db-check.sh

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres
