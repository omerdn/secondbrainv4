name: Hata
description: Beklenmeyen davranış veya hata bildirimi
title: "[Bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: Ne oldu?
      description: Gözlenen davranış. Kişisel veri, token veya şifre paylaşmayın.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ne bekleniyordu?
      description: Varsa ilgili PRD kuralını belirtin (ör. R7, V9).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Yeniden üretme adımları
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - Sunucu
  - type: textarea
    id: logs
    attributes:
      label: Log / ekran görüntüsü
      render: text
