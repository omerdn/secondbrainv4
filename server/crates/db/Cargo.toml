[package]
name = "db"
description = "Connection pool, migrations and database test helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test helper (`db::testing`): Postgres via testcontainers, one isolated schema per test.
# Enable from other crates' dev-dependencies: `db = { path = "../db", features = ["testing"] }`.
testing = ["dep:testcontainers"]

[dependencies]
chrono.workspace = true
kernel = { path = "../kernel" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
testcontainers = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
db = { path = ".", features = ["testing"] }
proptest.workspace = true
