# Staging/beta stack on a single host (T0.7.1, ARCHITECTURE §17): server, postgres, caddy.
# Usage (from this directory): cp .env.example .env, edit, then `docker compose up -d --build`.
# See infra/staging/README.md.
name: secondbrain-staging

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondbrain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-secondbrain}
    # No published port: only the server reaches the database, over the internal network.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: secondbrain-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    # Everything else the server reads (sign-in providers, Sentry, CORS_EXTRA_ORIGINS, ...).
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-secondbrain}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secondbrain}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      APP_ENV: ${APP_ENV:-staging}
      LOG_FORMAT: json
      PUBLIC_WEB_URL: https://${WEB_DOMAIN:?set WEB_DOMAIN in .env}
      PUBLIC_API_URL: https://${API_DOMAIN:?set API_DOMAIN in .env}
      # Only Caddy can reach the server, and it sets the client address headers.
      TRUST_PROXY_HEADERS: "true"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 40s

  caddy:
    build:
      context: ../..
      dockerfile: infra/staging/web.Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://${API_DOMAIN}
    image: secondbrain-caddy:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Certificates and ACME account: must survive restarts (Let's Encrypt rate limits).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
